<ion-content class="profile-content">
  <div class="page-wrapper">
    <div class="profile-card-container">

      <!-- Encabezado con flecha dentro de la tarjeta -->
      <div class="card-header">
        <button class="back-btn" (click)="guardarCambios()">
          <ion-icon name="arrow-back-outline"></ion-icon>
        </button>
        <h2 class="header-title">Mi perfil</h2>
      </div>

      <!-- Avatar -->
      <div class="avatar-wrapper">
        <div class="avatar-circle">
          <ion-icon name="person" class="avatar-icon"></ion-icon>
        </div>
      </div>

      <!-- Datos de Usuario -->
      <div class="user-info">
        <h2 class="user-name">Nombre</h2>
        <h3 class="user-role">Usuario</h3>
        <h4 class="section-heading">Información Personal</h4>
      </div>

      <!-- Formulario -->
      <div class="form-wrapper">
        <div class="input-group">
          <label class="input-label">Nombre completo</label>
          <div class="input-box">
            <input type="text" [(ngModel)]="nombreCompleto" class="field-input" />
            <ion-icon name="pencil" class="pencil-icon"></ion-icon>
          </div>
        </div>

        <div class="input-group">
          <label class="input-label">Nombre de usuario</label>
          <div class="input-box">
            <input type="text" [(ngModel)]="nombreUsuario" class="field-input" />
            <ion-icon name="pencil" class="pencil-icon"></ion-icon>
          </div>
        </div>

        <!-- Botones de Acción -->
        <div class="actions-wrapper">
          <button class="btn-primary-brown" (click)="guardarCambios()">
            <ion-icon name="save-outline"></ion-icon>
            <span>Guardar cambios</span>
          </button>

          <button class="btn-primary-brown" (click)="cerrarSesion()">
            <ion-icon name="exit-outline"></ion-icon>
            <span>Cerrar sesión</span>
          </button>
        </div>
      </div>

    </div>
  </div>
</ion-content>
