<ion-content class="ion-padding">
  <div class="card-container">
    
    <!-- Encabezado Superior (Logo + Título + Iconos) -->
    <div class="header-bar">
      <div class="brand-info">
        <img src="assets/icon/Logo.png" alt="Logo" class="brand-logo" />
        <div class="brand-text">
          <h2 class="brand-name">My Digital Store</h2>
          <span class="brand-tag">Tienda</span>
        </div>
      </div>
      <div class="header-actions">
        <ion-button fill="clear" class="icon-btn">
          <ion-icon name="location-outline"></ion-icon>
        </ion-button>
        <ion-button fill="clear" class="icon-btn">
          <ion-icon name="search-outline"></ion-icon>
        </ion-button>
        <ion-button fill="clear" class="icon-btn">
          <ion-icon name="person-circle-outline"></ion-icon>
        </ion-button>
      </div>
    </div>

    <!-- Saludo -->
    <h1 class="welcome-title">¡Hola, bienvenido!</h1>

    <!-- Selector de Dirección -->
    <div class="address-selector">
      <ion-icon name="location" class="pin-icon"></ion-icon>
      <div class="address-text">
        <span class="label">Entregar en</span>
        <strong class="value">Av. Reforma 124, Dpto 4B</strong>
      </div>
      <ion-icon name="chevron-down-outline" class="arrow-icon"></ion-icon>
    </div>

    <!-- Buscador -->
    <div class="search-box">
      <ion-icon name="search-outline"></ion-icon>
      <input type="text" placeholder="Buscar botanas, refrescos ..." />
    </div>

    <!-- Categorías (Chips con borde) -->
    <div class="categories-scroll">
      <button class="chip active">Todos</button>
      <button class="chip">Bebidas</button>
      <button class="chip">Botanas</button>
      <button class="chip">Panadería</button>
    </div>

    <!-- Título de Sección -->
    <h3 class="section-title">Populares ahora</h3>

    <!-- Rejilla de Productos -->
    <ion-grid class="ion-no-padding">
      <ion-row>
        
        <!-- Producto 1: Coca-Cola -->
        <ion-col size="6" class="pe-1 pb-2">
          <div class="product-card">
            <div class="product-img-wrapper">
              <img src="assets/coca-cola.png" alt="Coca-Cola" />
            </div>
            <span class="product-weight">600 ml</span>
            <h4 class="product-title">Coca-Cola</h4>
            <p class="product-desc">Refresco refrescante</p>
            <div class="product-footer">
              <span class="product-price">$24.00</span>
              <button class="btn-add">+ Agregar</button>
            </div>
          </div>
        </ion-col>

        <!-- Producto 2: Takis Fuego -->
        <ion-col size="6" class="ps-1 pb-2">
          <div class="product-card">
            <div class="product-img-wrapper">
              <img src="assets/takis-fuego.png" alt="Takis Fuego" />
            </div>
            <span class="product-weight">45 g</span>
            <h4 class="product-title">Takis Fuego</h4>
            <p class="product-desc">Botana de maíz picante</p>
            <div class="product-footer">
              <span class="product-price">$20.00</span>
              <button class="btn-add">+ Agregar</button>
            </div>
          </div>
        </ion-col>

        <!-- Producto 3: Pepsi -->
        <ion-col size="6" class="pe-1 pb-2">
          <div class="product-card">
            <div class="product-img-wrapper">
              <img src="assets/pepsi.png" alt="Pepsi" />
            </div>
            <span class="product-weight">600 ml</span>
            <h4 class="product-title">Pepsi</h4>
            <p class="product-desc">Refresco de cola</p>
            <div class="product-footer">
              <span class="product-price">$22.00</span>
              <button class="btn-add">+ Agregar</button>
            </div>
          </div>
        </ion-col>

        <!-- Producto 4: Maruchan -->
        <ion-col size="6" class="ps-1 pb-2">
          <div class="product-card">
            <div class="product-img-wrapper">
              <img src="assets/maruchan.png" alt="Maruchan" />
            </div>
            <span class="product-weight">64 g</span>
            <h4 class="product-title">Maruchan</h4>
            <p class="product-desc">Sopa instantánea</p>
            <div class="product-footer">
              <span class="product-price">$18.00</span>
              <button class="btn-add">+ Agregar</button>
            </div>
          </div>
        </ion-col>

      </ion-row>
    </ion-grid>

  </div>
</ion-content>
